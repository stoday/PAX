[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "clockmate"
version = "2.0.0"
description = "便利工作助手"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ClockMate Team", email = "support@clockmate.com"},
]
keywords = ["timesheet", "automation", "hr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "annotated-doc==0.0.4",
    "bcrypt==5.0.0",
    "beautifulsoup4>=4.9.0",
    "certifi==2025.11.12",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.0",
    "colorama==0.4.6",
    "cryptography==46.0.3",
    "exceptiongroup==1.3.0",
    "idna==3.11",
    "invoke==2.2.1",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "pycparser==2.23",
    "pyfiglet>=0.8.0",
    "pygments==2.19.2",
    "pynacl==1.6.1",
    "python-dotenv>=0.19.0",
    "requests>=2.25.0",
    "rich==14.2.0",
    "selenium>=4.0.0",
    "urllib3==2.5.0",
    "webdriver-manager>=3.8.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "akasha-terminal==0.9.13",
]

[project.urls]
Homepage = "https://gitlab.com/your-username/clockmate"
Repository = "https://gitlab.com/your-username/clockmate.git"
Issues = "https://gitlab.com/your-username/clockmate/-/issues"

# entry point: 指向start_services:main
[project.scripts]
clockmate = "clockmate.start_services:main"
pax = "clockmate.start_services:main"

[pytest]
markers =
    integration: marks tests that require external resources or take a long time.

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]